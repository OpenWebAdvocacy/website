[build]
command = "npm run production"
publish = "dist"

[[plugins]]
package = "netlify-plugin-cache"
  [plugins.inputs]
  paths = [".cache"]

[build.environment]
NODE_VERSION = "26"

# Serve the English article here until a Spanish translation is ready.
[[redirects]]
  from = "/es/blog/commission-responds-declares-browser-competition-a-dma-priority/"
  to = "/blog/commission-responds-declares-browser-competition-a-dma-priority/"
  status = 200
  force = true

# Redirect for end-user’s browser preference override
[[redirects]]
  from = "/"
  to = "/es"
  status = 302
  force = true
  conditions = {Language = ["es"]}

[[redirects]]
  from = "/"
  to = "/ja"
  status = 302
  force = true
  conditions = {Language = ["ja"]}
